<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | d20 SRD Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
      background: #eee8da;
      color: #26211d;
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(680px, 100%);
      padding: 42px;
      background: #fffdf8;
      border: 1px solid #c9bda9;
      box-shadow: 0 8px 24px rgb(49 34 23 / 12%);
      text-align: center;
    }
    h1 { color: #542020; font-size: clamp(2rem, 7vw, 3.5rem); }
    p { font-size: 1.1rem; }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 18px;
      margin-top: 28px;
    }
    a { color: #185b83; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p>404</p>
    <h1>That rule slipped away.</h1>
    <p>
      The page may have moved, or the address may be incomplete.
      Try one of the main rules sections below.
    </p>
    <nav aria-label="Helpful destinations">
      <a href="/">Home</a>
      <a href="/classes/">Classes</a>
      <a href="/feats/">Feats</a>
      <a href="/spells/">Spells</a>
